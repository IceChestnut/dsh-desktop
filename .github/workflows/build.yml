# Build the desktop packages natively on GitHub-hosted runners and, on a v*
# tag push, publish them to a GitHub Release.
#
# Cost control: macOS runners bill at 10x the Linux rate, so the platform
# matrix is decided by a plan job and defaults as follows:
#   - push to main:            Linux only (cheap validation build)
#   - push of a v* tag:        all three platforms (release build)
#   - manual workflow_dispatch: the `platforms` input decides (default
#                               linux+windows; pick "all" for macOS too)
#
# The harness is installed from the published @deepseek-ai/dsh npm package
# (version = package.json version, overridable via the `version` dispatch
# input), so no upstream source checkout is needed.
name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override the bundled @deepseek-ai/dsh version (default: package.json version)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Platforms to build: linux, linux,windows, or all (adds macOS — 10x billing)'
        required: false
        type: choice
        options:
          - linux,windows
          - linux
          - all
        default: linux,windows
  push:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  # Skip macOS code signing / notarization (no certificate configured here).
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # electron-builder probes for a draft release to publish into when CI is
  # detected; it reads GH_TOKEN, not the Actions-native GITHUB_TOKEN. With the
  # token present it only uploads into an existing draft — for ordinary builds
  # it simply does not publish.
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    name: Plan platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Compute matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          # Release builds (v* tag push) always cover all three platforms;
          # ordinary pushes build Linux only; dispatch uses its input.
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/* ]]; then
            PLATFORMS="all"
          elif [ "$EVENT" = "push" ]; then
            PLATFORMS="linux"
          fi
          case "$PLATFORMS" in
            all) set -- linux windows macos ;;
            linux,windows) set -- linux windows ;;
            linux) set -- linux ;;
            windows) set -- windows ;;
            *) echo "::error::Unknown platforms '$PLATFORMS'"; exit 1 ;;
          esac
          matrix='[]'
          for p in "$@"; do
            case "$p" in
              linux)   runner=ubuntu-latest  ; script=dist ;;
              windows) runner=windows-2025   ; script=dist:win ;;
              macos)   runner=macos-latest   ; script=dist:mac ;;
              *) echo "::error::Unknown platform '$p'"; exit 1 ;;
            esac
            matrix="$(jq -c --arg p "$p" --arg runner "$runner" --arg script "$script" '. + [{platform: $p, runner: $runner, script: $script}]' <<< "$matrix")"
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Building: $matrix"

  build:
    name: ${{ matrix.platform }} (${{ matrix.runner }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install build tooling
        run: npm ci

      - name: Install bundled harness
        env:
          DSH_UPSTREAM_VERSION: ${{ inputs.version }}
        run: npm run harness

      - name: Build package
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # gh release create needs the git repo for its release context.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          pattern: dsh-desktop-*
          merge-multiple: true

      - name: Publish release
        run: |
          gh release create "${{ github.ref_name }}" dist-all/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}